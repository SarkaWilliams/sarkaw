# Sveltia CMS — konfigurace editoru na /admin
# Vyplň před nasazením (viz PROJEKT-BRIEF.md, krok 5):
#   - repo: <owner>/<repo>       → skutečný GitHub repozitář
#   - base_url: OAuth proxy URL  → adresa nasazené sveltia-cms-auth služby

backend:
  name: github
  repo: SarkaWilliams/sarkaw
  branch: main
  base_url: https://sarkaw-cms-auth.sarka-williams.workers.dev

media_folder: public/images
public_folder: /images

i18n:
  structure: multiple_files
  locales: [cs, en]
  default_locale: cs

collections:
  - name: blog
    label: Blog
    folder: src/content/blog
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Název", name: title, widget: string }
      - { label: "Datum", name: date, widget: datetime }
      - { label: "Anotace", name: excerpt, widget: text }
      - { label: "Obsah článku", name: body, widget: markdown }
  - name: pages
    label: Stránky
    i18n: true
    files:
      - name: home
        label: Úvodní stránka
        file: src/content/pages/home.{{locale}}.json
        i18n: true
        fields:
          - { label: "Hero nadpis", name: heroTitle, widget: string, i18n: true }
          - { label: "Hero podnadpis", name: heroSubtitle, widget: text, i18n: true }
          - { label: "Hero motto (citát)", name: heroQuote, widget: string, required: false, i18n: true }
          - { label: "Hero obrázek", name: heroImage, widget: image, i18n: duplicate }
          - { label: "Fotka (O mně)", name: aboutImage, widget: image, i18n: duplicate }
          - { label: "O mně", name: about, widget: markdown, i18n: true }
          - label: "O mně — certifikáty (aktuálně platné)"
            name: aboutBadgesCurrent
            widget: list
            i18n: true
            min: 0
            max: 5
            fields:
              - { label: "Odznak (obrázek)", name: image, widget: image, i18n: duplicate }
              - { label: "Alt text (název certifikace)", name: alt, widget: string, i18n: true }
          - label: "O mně — certifikáty (dříve získané)"
            name: aboutBadgesPast
            widget: list
            i18n: true
            min: 0
            max: 5
            fields:
              - { label: "Odznak (obrázek)", name: image, widget: image, i18n: duplicate }
              - { label: "Alt text (název certifikace)", name: alt, widget: string, i18n: true }
          - label: "Služby"
            name: services
            widget: list
            i18n: true
            fields:
              - { label: "Název", name: title, widget: string, i18n: true }
              - { label: "Popis", name: description, widget: text, i18n: true }
          - label: "Co nabízím"
            name: offerings
            widget: list
            i18n: true
            fields:
              - { label: "Název", name: title, widget: string, i18n: true }
              - { label: "Citát (nepovinné)", name: quote, widget: string, required: false, i18n: true }
              - { label: "Úvodní text", name: intro, widget: text, i18n: true }
              - { label: "Nadpis nad seznamem bodů (nepovinné)", name: itemsHeading, widget: string, required: false, i18n: true }
              - label: "Body seznamu"
                name: items
                widget: list
                i18n: true
                field: { label: "Položka", name: item, widget: string }
          - label: "Jak probíhá spolupráce"
            name: process
            widget: object
            i18n: true
            fields:
              - { label: "Nadpis sekce", name: title, widget: string, i18n: true }
              - label: "Kroky"
                name: steps
                widget: list
                i18n: true
                fields:
                  - { label: "Název kroku", name: title, widget: string, i18n: true }
                  - { label: "Popis kroku", name: description, widget: text, i18n: true }
              - { label: "CTA text", name: ctaText, widget: text, i18n: true }
              - { label: "Tagline", name: tagline, widget: string, i18n: true }
          - label: "Reference"
            name: testimonials
            widget: list
            i18n: true
            fields:
              - { label: "Citace", name: quote, widget: text, i18n: true }
              - { label: "Jméno", name: name, widget: string, i18n: duplicate }
              - { label: "Pozice / spolupráce (nepovinné)", name: role, widget: string, required: false, i18n: true }
          - label: "Kontakt"
            name: contact
            widget: object
            i18n: true
            fields:
              - { label: "Jméno a titul", name: name, widget: string, i18n: duplicate }
              - { label: "IČO", name: ico, widget: string, i18n: duplicate }
              - { label: "Adresa", name: address, widget: string, i18n: true }
              - { label: "E-mail", name: email, widget: string, i18n: duplicate }
              - { label: "Telefon", name: phone, widget: string, i18n: duplicate }
              - { label: "LinkedIn (odkaz)", name: linkedinUrl, widget: string, i18n: duplicate }
              - { label: "Instagram (odkaz)", name: instagramUrl, widget: string, i18n: duplicate }
              - { label: "Nadpis nad kontaktním formulářem", name: formHeading, widget: string, i18n: true }
              - { label: "Potvrzovací text po odeslání formuláře", name: formSuccessMessage, widget: text, i18n: true }
          - label: "Cena koučování"
            name: pricing
            widget: object
            i18n: true
            fields:
              - { label: "Nadpis", name: title, widget: string, i18n: true }
              - { label: "Text", name: text, widget: text, i18n: true }
          - { label: "Text tlačítka „Napište mi“", name: ctaText, widget: string, i18n: true }
      - name: privacy
        label: "Ochrana osobních údajů"
        file: src/content/pages/privacy.{{locale}}.json
        i18n: true
        fields:
          - { label: "Nadpis stránky", name: title, widget: string, i18n: true }
          - { label: "Úvodní text", name: intro, widget: text, i18n: true }
          - label: "Odstavce"
            name: sections
            widget: list
            i18n: true
            fields:
              - { label: "Nadpis odstavce", name: heading, widget: string, i18n: true }
              - { label: "Text odstavce", name: text, widget: text, i18n: true }
              - { label: "Odrážky (nepovinné)", name: items, widget: list, i18n: true, field: { label: "Položka", name: item, widget: string }, required: false }
              - { label: "Text pod odrážkami (nepovinné)", name: textAfter, widget: text, required: false, i18n: true }
          - { label: "Text „naposledy aktualizováno“", name: lastUpdated, widget: string, i18n: true }
  - name: perspectives
    label: "Můj pohled"
    folder: src/content/perspectives
    create: true
    slug: "{{slug}}"
    i18n: true
    fields:
      - { label: "Nadpis", name: title, widget: string, i18n: true }
      - { label: "Datum", name: date, widget: datetime, i18n: duplicate }
      - { label: "Anotace / text", name: excerpt, widget: text, i18n: true }
      - { label: "Odkaz na LinkedIn článek", name: linkedinUrl, widget: string, i18n: duplicate }
      - { label: "Náhledový obrázek", name: image, widget: image, required: false, i18n: duplicate }
